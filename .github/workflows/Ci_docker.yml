name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build ./MCP_KNP_DOCKER/client --file ./MCP_KNP_DOCKER/client/Dockerfile --tag my-mcp-server:$(date +%s)
